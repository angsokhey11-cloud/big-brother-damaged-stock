const PATCH=String.raw`
(function(){
'use strict';
document.body.classList.add('bb-damage-accounting-mobile');
const title=document.querySelector('.title h1');if(title)title.textContent='💰 Damage Accounting & Recovery Ledger';
const main=document.querySelector('#rows')?.closest('table');
const wo=document.querySelector('#writeOffRows')?.closest('table');

if(main){main.classList.add('bb-main-ledger');const h=main.querySelectorAll('thead th');const labels=['Date','Status','Type','Movement','Product','Code','Qty','Unit','Unit Cost','Stock Cost','Write-Off / Expense','Write-Off','Client / Supplier','Recovery Doc','Recovery Value','Recovered','Outstanding','Recovery','Exchange Doc','Exchange Received','Exchange Pending','Treatment','Location','Controller','Reference','Note'];labels.forEach((x,i)=>{if(h[i])h[i].textContent=x});while(h.length>labels.length&&main.querySelector('thead tr')?.lastElementChild){main.querySelector('thead tr').lastElementChild.remove();}}

})();
`;
try{
 const response=await fetch('accounting.html?v=20260915-mobile-2',{cache:'no-store'});

 let html=await response.text();
 const h=html.toLowerCase().indexOf('</head>');if(h<0)throw new Error('Accounting source missing </head>.');
 html=html.slice(0,h)+'<style id="bbDamageAccountingMobileStyle">'+MOBILE_STYLE+'</style>\n'+html.slice(h);
 const b=html.toLowerCase().lastIndexOf('</body>');if(b<0)throw new Error('Accounting source missing </body>.');
 html=html.slice(0,b)+'<script>'+PATCH.replace(/<\/script/gi,'<\\/script')+'<\/script>\n'+html.slice(b);
 document.open();document.write(html);document.close();
}catch(error){document.body.innerHTML='<div class="bb-loader"><div class="bb-loader-card">Damage Accounting could not load.<span>'+String(error&&error.message||error)+'</span></div></div>'}
