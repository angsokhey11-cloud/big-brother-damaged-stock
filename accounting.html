<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIG BROTHER — Damage Accounting & Recovery Ledger</title>
<style>
html,body{margin:0;min-height:100%;font-family:Inter,Arial,Helvetica,sans-serif;background:#eef3f8;color:#24384c}
.boot{max-width:900px;margin:40px auto;padding:20px;background:#fff;border:1px solid #d9e2ef;border-radius:14px;color:#17457a;font-weight:800}
.boot.error{color:#9d2f2f;background:#fff1f1;border-color:#f0cece}
</style>
</head>
<body>
<div id="boot" class="boot">Loading Damage Accounting & Recovery Ledger…</div>
<script>
(async function(){
  'use strict';
  const SOURCE='https://raw.githubusercontent.com/angsokhey11-cloud/big-brother-damaged-stock/460df7514197af59e09bed526069deb92ddea698/accounting.html';
  try{
    const response=await fetch(SOURCE,{cache:'no-store'});
    if(!response.ok)throw new Error('Could not load ledger source ('+response.status+').');
    let html=await response.text();

    // Repair the malformed setStatus() call in saveWriteOff().
    const broken='money(\n  result?.writeoffValue\n)\n\n+\n\n"."\n\n      "success"';
    const fixed='money(\n  result?.writeoffValue\n)\n\n+\n\n".",\n\n      "success"';
    if(!html.includes(broken))throw new Error('Ledger repair target was not found.');
    html=html.replace(broken,fixed);

    document.open();
    document.write(html);
    document.close();
  }catch(error){
    const boot=document.getElementById('boot');
    boot.className='boot error';
    boot.textContent='Damage Accounting Ledger could not start: '+String(error?.message||error);
    console.error(error);
  }
})();
</script>
</body>
</html>
